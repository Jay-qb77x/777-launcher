<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://cdn.discordapp.com https://*.githubusercontent.com https://i.ytimg.com; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>777 Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Icon sprite -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  </svg>

  <!-- User-chosen background picture (see Appearance panel) -->
  <div class="bg-layer" id="bg-image" aria-hidden="true"></div>
  <div class="bg-layer bg-dim" id="bg-dim" aria-hidden="true"></div>
  <canvas class="bg-layer" id="bg-fx" aria-hidden="true"></canvas>

  <div class="app">
    <aside class="sidebar">
      <div class="brand" aria-label="777 Launcher">
        <img class="brand-logo" src="logo.png" alt="777 Development" width="72" height="72">
        <span class="brand-name">Launcher</span>
      </div>

      <nav class="nav" id="nav" aria-label="Main">
        <button class="nav-item is-active" data-view="home" aria-current="page"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></button>
        <button class="nav-item" data-view="updates"><svg class="icon"><use href="#i-bell"/></svg><span>Updates</span></button>
        <button class="nav-item" data-view="tutorials"><svg class="icon"><use href="#i-play"/></svg><span>Tutorials</span></button>
        <button class="nav-item" data-view="scripts"><svg class="icon"><use href="#i-code"/></svg><span>Scripts</span></button>
        <button class="nav-item" data-view="extras"><svg class="icon"><use href="#i-folder"/></svg><span>Extras</span></button>
      </nav>

      <div class="account" id="account"></div>
    </aside>

    <main class="content" id="content">
      <div id="banner" class="banners"></div>
      <section class="view is-active" id="view-home" aria-live="polite"></section>
      <section class="view" id="view-updates"></section>
      <section class="view" id="view-tutorials"></section>
      <section class="view" id="view-scripts"></section>
      <section class="view" id="view-extras"></section>
    </main>
  </div>

  <!-- Sign-in screen -->
  <div class="gate is-hidden" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate-card">
      <div class="brand brand-lg"><img class="brand-logo" src="logo.png" alt="777 Development" width="150" height="150"><span class="brand-name">Launcher</span></div>
      <h1 id="gate-title">Sign in to continue</h1>
      <p class="gate-text" id="gate-text">Use your Discord account to get in.</p>
      <p class="gate-error" id="gate-error" role="alert"></p>
      <div class="gate-actions">
        <button class="btn btn-discord btn-lg" id="gate-signin">Continue with Discord</button>
        <button class="btn btn-ghost" id="gate-cancel">Cancel</button>
      </div>
      <p class="gate-fine">The launcher reads your Discord username and avatar, nothing else. It never sees your password, servers or messages.</p>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
